# CI: host unit tests + firmware build against sdkconfig.defaults
# (the local dev sdkconfig is untracked/bench-flavored on purpose - CI is the
# production-flavor gate; releases are cut from the same defaults).
# The firmware job also runs tools/ci_size_report.py (same as smartcar_remote):
# flash/RAM usage with free-margin percentages into the job summary, failing
# the build past the size gates (app <= 90% of the OTA slot, static DIRAM
# <= 95%, extra images must fit their partition).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: make -C test/host check

  firmware:
    name: Firmware build + size gates (IDF v6.1-beta1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # no PROJECT_VER override: git describe feeds it

      - name: Cache ESP-IDF v6.1-beta1 and toolchain
        id: idf
        uses: actions/cache@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: idf-v6.1-beta1-esp32c6

      - name: Install ESP-IDF v6.1-beta1 (esp32c6 target only)
        if: steps.idf.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v6.1-beta1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh esp32c6

      - name: Build
        run: |
          . ~/esp-idf/export.sh
          idf.py build

      - name: Firmware size & resource margins
        run: |
          . ~/esp-idf/export.sh
          python tools/ci_size_report.py \
            --map build/esp32c6_car.map \
            --bin build/esp32c6_car.bin \
            --partitions partitions.csv \
            --extra-bin assets=build/assets.bin

      - name: Report
        run: |
          echo "version: $(git describe --tags --dirty)"
          ls -la build/esp32c6_car.bin build/assets.bin
