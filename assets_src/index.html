<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>SmartDrive 控制台</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <img class="logo" src="/logo.svg" alt="">
  <div class="brand">
    <b id="ssid">SmartDrive</b>
    <span id="ver">--</span>
  </div>
  <div class="hstat">
    <span class="pill" id="role_pill"><b id="role_txt">--</b></span>
    <span class="pill"><span class="dot" id="dot_tc"></span>车</span>
    <span class="pill"><span class="dot" id="dot_ws"></span>WS</span>
    <span class="pill" id="batt_pill">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="2" y="8" width="17" height="9" rx="2.5"/>
        <path d="M22 11v3" stroke-linecap="round"/>
        <rect x="4.5" y="10.5" width="9" height="4" rx="1" fill="currentColor" stroke="none"/>
      </svg>
      <b id="batt_pct">--</b><span id="batt_v"></span>
    </span>
  </div>
</header>
<main>
  <section class="card" id="panel">
    <div class="gauge">
      <label>左轮</label>
      <div class="bar bar-t"><div id="bar_lt"></div></div>
      <div class="bar bar-m"><div id="bar_lm"></div></div>
      <div class="readout"><span id="v_lt">0</span><small>mm/s</small></div>
      <label class="gauge-sub">目标 · 实测</label>
    </div>
    <div id="speedo">
      <div id="speed_val">--</div>
      <div id="speed_unit">km/h</div>
      <div id="speed_dir">&nbsp;</div>
      <div id="state" class="state" data-tone="dim">未连接</div>
    </div>
    <div class="gauge">
      <label>右轮</label>
      <div class="bar bar-t"><div id="bar_rt"></div></div>
      <div class="bar bar-m"><div id="bar_rm"></div></div>
      <div class="readout"><span id="v_rt">0</span><small>mm/s</small></div>
      <label class="gauge-sub">目标 · 实测</label>
    </div>
  </section>
  <section class="card joy-card">
    <div id="joy">
      <span class="guide" aria-hidden="true"></span>
      <span class="arr n" aria-hidden="true">▲</span>
      <span class="arr s" aria-hidden="true">▼</span>
      <span class="arr w" aria-hidden="true">◀</span>
      <span class="arr e" aria-hidden="true">▶</span>
      <div id="knob"></div>
    </div>
    <div class="row ctl">
      <button id="btn_stop" class="danger">STOP</button>
      <button id="btn_pair">配对</button>
    </div>
    <div class="row stats">
      <span class="chip">里程 <b id="odo">0</b> m</span>
      <span class="chip" id="rtt">rtt --</span>
    </div>
  </section>
  <section class="card" id="maint">
    <details>
      <summary>维护 · 固件升级</summary>
      <div class="mrow">
        <label class="file"><input type="file" id="file_c6" accept=".bin"><span id="lbl_c6">选择 C6 固件 (.bin)</span></label>
        <button id="btn_ota_c6">升级 C6</button>
      </div>
      <div class="mrow">
        <label class="file"><input type="file" id="file_tc" accept=".bin"><span id="lbl_tc">选择 TC275 固件 (.bin)</span></label>
        <button id="btn_ota_tc">升级 TC275</button>
      </div>
      <div class="ota-bar"><div id="ota_bar"></div></div>
      <div id="ota_progress"></div>
      <div class="mrow link"><a href="/diag">诊断界面 /diag →</a></div>
      <div class="mrow link"><a href="/calib.html">台架标定 /calib.html →</a></div>
    </details>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
